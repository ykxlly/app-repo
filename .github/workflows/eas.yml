name: EAS iOS CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_submit_ios:
    name: Build and Submit iOS
    runs-on: macos-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Set up EAS CLI
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Step 5: Build iOS application
      - name: Build iOS
        run: npx eas build --platform ios --profile production --non-interactive

      # Step 6: Submit iOS build to App Store
      - name: Submit iOS build
        run: npx eas submit --platform ios --profile production --non-interactive --latest
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}